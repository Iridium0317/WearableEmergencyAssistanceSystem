name: ReachGateway
options:
  bundleIdPrefix: com.iridium0317
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4JHUUU37V8
targets:
  ReachGateway:
    type: application
    platform: iOS
    sources: [ReachGateway]
    info:
      path: ReachGateway/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iridium0317.reachgateway
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reach
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Reach connects to your Reach wearable to receive emergency button alerts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  ReachGatewayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReachGatewayTests]
    dependencies:
      - target: ReachGateway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ReachGateway:
    build:
      targets:
        ReachGateway: all
        ReachGatewayTests: [test]
    test:
      targets: [ReachGatewayTests]
