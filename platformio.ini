; Shared settings for both firmware builds.
[nano33ble_common]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags = -Isrc/app -Isrc/services -Isrc/drivers
; Warnings only for our sources, so third-party library noise can't hide ours.
build_src_flags = -Wall -Wextra
lib_deps = arduino-libraries/ArduinoBLE@^1.5.0
test_ignore = *

; Production build: alerts go over BLE.
[env:nano33ble]
extends = nano33ble_common

; Console-driven build: SimulatedLink replaces BLE so the state machine can be
; regression-tested over serial alone (tests/bench/bench.py).
[env:nano33ble_sim]
extends = nano33ble_common
build_flags = ${nano33ble_common.build_flags} -DUSE_SIMULATED_LINK
build_src_filter = +<*> -<drivers/ble_link.cpp>
lib_deps =

; Host-side unit tests for hardware-independent logic in lib/.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
