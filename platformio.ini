[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -Isrc/app -Isrc/services
test_ignore = *

; Host-side unit tests for hardware-independent logic in lib/.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
